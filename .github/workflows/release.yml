name: release

# Push a tag vX.Y.Z (matching .claude-plugin/plugin.json "version") to build
# the binaries and publish them, with SHA256SUMS, as a GitHub release. The
# plugin launcher (bin/perritite) downloads from exactly these assets.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tag matches the plugin version
        run: |
          v=$(jq -r .version .claude-plugin/plugin.json)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != plugin.json version $v"; exit 1; }
      - run: go test ./...
      - name: Build
        run: scripts/build-release.sh "${GITHUB_REF_NAME#v}" dist
      - name: Smoke-test the linux/amd64 binary
        run: '[ "$(dist/perritite-linux-amd64 version)" = "perritite ${GITHUB_REF_NAME#v}" ]'
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
